<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite Workouts</title>
<meta name="description" content="Elite Workouts — a strength and mobility training log for iPhone and iPad.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
  /* Palette matches the app and the /w/ share page. */
  :root {
    --bg: #0B0B0C;
    --surface: #1C1C1E;
    --text: #FFFFFF;
    --secondary: #8E8E93;
    --dim: #5A5A5E;
    --amber: #F5C518;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 32px 24px;
  }
  main { width: 100%; max-width: 30rem; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 6vw, 2.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .rule {
    width: 44px; height: 3px; border-radius: 2px;
    background: var(--amber);
    margin: 18px auto 0;
  }
  .lede { margin: 20px 0 0; color: var(--secondary); text-wrap: balance; }
  .beta {
    margin: 28px 0 0; padding: 14px 16px;
    background: var(--surface); border-radius: 12px;
    font-size: 15px; color: var(--secondary);
  }
  .contact { margin: 28px 0 0; font-size: 15px; }
  a { color: var(--amber); text-decoration: none; border-bottom: 1px solid rgba(245,197,24,.35); }
  a:hover { border-bottom-color: var(--amber); }
  a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 2px; }
  .footer { margin: 36px 0 0; font-size: 13px; color: var(--dim); }
  .footer a { color: var(--dim); border-bottom-color: rgba(90,90,94,.5); }
</style>
</head>
<body>
  <main>
    <h1>Elite Workouts</h1>
    <div class="rule"></div>
    <p class="lede">A strength and mobility training log for iPhone and iPad. Plan routines, run them set by set, and keep the history.</p>
    <p class="beta">Currently in private beta through Apple TestFlight.</p>
    <p class="contact"><a href="mailto:support@xperilab.com">support@xperilab.com</a></p>
    <p class="footer">
      &copy; 2026 Xperilab, LLC ·
      <a href="https://www.xperilab.com/privacy/">Privacy</a> ·
      <a href="https://www.xperilab.com/support/">Support</a>
    </p>
  </main>
</body>
</html>
